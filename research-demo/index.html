<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPPO Research Hub Demo</title><style>body{margin:0;font:16px Arial,sans-serif;background:#f5f7f6;color:#1b1d1c}.loading{min-height:100vh;display:grid;place-items:center}.card{background:white;padding:28px 34px;border-radius:20px;box-shadow:0 16px 50px #0001;text-align:center}.dot{width:12px;height:12px;border-radius:50%;background:#0a7f54;display:inline-block;animation:p 1s infinite alternate}@keyframes p{to{opacity:.25;transform:scale(.7)}}</style></head><body><div class="loading"><div class="card"><span class="dot"></span><p>Loading OPPO Research Hub Demo…</p></div></div><script>(async()=>{const base='https://raw.githubusercontent.com/harbor0816at-design/oppo-austria-ai-kaufberater-v2/research-hub-demo-v0-1/research-demo/';const parts=await Promise.all([1,2,3,4,5,6].map(i=>fetch(base+'p'+i+'.txt',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Asset '+i+' unavailable');return r.text()})));const b=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const stream=new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()})().catch(e=>document.body.innerHTML='<div class="loading"><div class="card"><h2>Demo failed to load</h2><p>'+e.message+'</p></div></div>')</script></body></html>
