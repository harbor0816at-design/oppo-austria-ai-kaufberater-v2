[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oppo-austria-ai-kaufberater-backend"
version = "1.0.0"
description = "OPPO Austria AI Kaufberater backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0.40,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "redis>=5,<7",
  "langgraph>=0.6,<2",
  "python-multipart>=0.0.20,<1",
  "vercel>=0.5,<1",
  "cryptography>=44,<47"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "app.main:app"
