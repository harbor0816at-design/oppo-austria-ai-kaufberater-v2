<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="OPPO Austria AI-Kaufberater">
  <title>OPPO AI-Kaufberater</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/config.js"></script>
</head>
<body>
  <main class="page-shell">
    <section class="split-layout">
      <aside class="hero-column" aria-label="OPPO Highlights">
        <div id="hero-carousel" class="hero-carousel">
          <div id="hero-stage" class="hero-stage"></div>
          <button id="hero-prev" class="hero-arrow hero-prev" aria-label="Previous slide">‹</button>
          <button id="hero-next" class="hero-arrow hero-next" aria-label="Next slide">›</button>
          <div id="hero-dots" class="hero-dots" aria-label="Hero pagination"></div>
        </div>
      </aside>

      <section id="chat" class="chat-column">
        <header class="chat-header">
          <div class="brand-mark">OPPO</div>
          <div class="chat-heading">
            <h1>OPPO Kaufberatung · AI</h1>
            <p id="online-label">Offizielle Produktberatung · AI</p>
          </div>
          <button id="clear-chat" class="text-button">Verlauf löschen</button>
        </header>

        <div id="conversation" class="conversation" aria-live="polite"></div>
        <div id="quick-replies" class="quick-replies"></div>

        <form id="composer" class="composer">
          <label class="sr-only" for="message-input">Message</label>
          <textarea id="message-input" rows="1" maxlength="4000" placeholder="Schreib eine Nachricht …"></textarea>
          <button id="send-button" type="submit">Senden</button>
        </form>
      </section>
    </section>
  </main>

  <dialog id="subscribe-dialog" class="subscribe-dialog">
    <form id="subscribe-form" method="dialog">
      <button id="subscribe-close" class="dialog-close" type="button" aria-label="Close">×</button>
      <h2 id="subscribe-title">Zum Verkaufsstart benachrichtigen</h2>
      <p id="subscribe-product"></p>
      <input id="subscribe-sku" type="hidden">
      <div class="channel-tabs">
        <button type="button" data-channel="email" class="active">E-Mail</button>
        <button type="button" data-channel="whatsapp">WhatsApp</button>
      </div>
      <label>
        <span id="contact-label">Kontakt</span>
        <input id="subscribe-contact" required autocomplete="email">
      </label>
      <label class="consent-row">
        <input id="subscribe-consent" type="checkbox" required>
        <span id="consent-label"></span>
      </label>
      <button id="subscribe-submit" class="primary-button" type="submit">Vormerkung speichern</button>
      <p id="subscribe-result" class="form-result" aria-live="polite"></p>
    </form>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
