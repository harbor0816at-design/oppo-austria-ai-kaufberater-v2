name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  smoke:
    name: workflow-smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Confirm workflow
        run: |
          echo "GitHub Actions is running"
          echo "Branch: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify Python project metadata
        run: |
          test -f pyproject.toml
          python -c "import app; print('backend package import ok')"

      - name: Run backend tests
        run: python -m pytest -q

      - name: Compile backend
        run: python -m compileall -q app tests

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  secret-presence:
    name: secret-presence
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_TOKEN }}
      DEEPSEEK_API_KEY_VALUE: ${{ secrets.DEEPSEEK_API_KEY }}
      GOOGLE_JSON_VALUE: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_JSON_B64_VALUE: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
      DATABASE_URL_VALUE: ${{ secrets.DATABASE_URL }}
      REDIS_URL_VALUE: ${{ secrets.REDIS_URL }}
    steps:
      - name: Report secret presence only
        shell: bash
        run: |
          set -euo pipefail
          present() { if [ -n "$1" ]; then printf 'present'; else printf 'missing'; fi; }
          echo "VERCEL_TOKEN=$(present "$VERCEL_TOKEN_VALUE")"
          echo "DEEPSEEK_API_KEY=$(present "$DEEPSEEK_API_KEY_VALUE")"
          echo "GOOGLE_SERVICE_ACCOUNT_JSON=$(present "$GOOGLE_JSON_VALUE")"
          echo "GOOGLE_SERVICE_ACCOUNT_JSON_B64=$(present "$GOOGLE_JSON_B64_VALUE")"
          echo "DATABASE_URL=$(present "$DATABASE_URL_VALUE")"
          echo "REDIS_URL=$(present "$REDIS_URL_VALUE")"

  production-smoke:
    name: production-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Read production persistence public key
        shell: bash
        run: |
          set -euo pipefail
          key_url="https://oppo-austria-ai-kaufberater.vercel.app/system/persistence-public-key"
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/persistence-key.json -w '%{http_code}' "$key_url" || true)
            if [ "$code" = "200" ]; then
              cat /tmp/persistence-key.json
              exit 0
            fi
            sleep 10
          done
          cat /tmp/persistence-key.json || true
          exit 1

      - name: Verify production backend health and readiness
        shell: bash
        run: |
          set -euo pipefail
          health_url="https://oppo-austria-ai-kaufberater.vercel.app/healthz"
          ready_url="https://oppo-austria-ai-kaufberater.vercel.app/readyz"

          ok=0
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$health_url" || true)
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = "1"
          cat /tmp/health.json

          ok=0
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/ready.json -w '%{http_code}' "$ready_url" || true)
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            if [ "$code" = "503" ]; then
              cat /tmp/ready.json
              exit 1
            fi
            sleep 10
          done
          test "$ok" = "1"
          cat /tmp/ready.json

      - name: Verify production frontend
        shell: bash
        run: |
          set -euo pipefail
          page_url="https://oppo-austria-ai-kaufberater-web.vercel.app/smartphone-finder/"
          config_url="https://oppo-austria-ai-kaufberater-web.vercel.app/config.js"

          ok=0
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/frontend.html -w '%{http_code}' "$page_url" || true)
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = "1"
          grep -q "OPPO Kaufberatung" /tmp/frontend.html
          curl -fsS "$config_url" -o /tmp/config.js
          grep -q "https://oppo-austria-ai-kaufberater.vercel.app" /tmp/config.js

  ci-status:
    name: publish-ci-status
    if: always() && github.event_name == 'push'
    needs: [smoke, backend, frontend, production-smoke, secret-presence]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish combined CI status
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          PROD_RESULT: ${{ needs.production-smoke.result }}
        shell: bash
        run: |
          set -euo pipefail
          state="success"
          description="Repository checks passed"
          for result in "$SMOKE_RESULT" "$BACKEND_RESULT" "$FRONTEND_RESULT" "$PROD_RESULT"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              state="failure"
              description="One or more repository checks failed"
            fi
          done

          payload=$(printf '{"state":"%s","context":"CI / repository","description":"%s"}' "$state" "$description")
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"

          test "$state" = "success"
